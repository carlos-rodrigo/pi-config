<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" aria-labelledby="static-path-title static-path-desc" data-review-id="diagram.static-document-path.svg">
  <title id="static-path-title">Approved content becomes one portable Protocol-styled HTML document</title>
  <desc id="static-path-desc">A vertical path connects approved product or architecture content, the static shell build, a self-contained HTML artifact, and the reader. A side branch from the artifact shows reduced-motion, script-free, and print fallbacks.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#71717a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>.stage{stroke-width:1.5;vector-effect:non-scaling-stroke}.title{font:650 18px ui-sans-serif,system-ui;fill:#18181b}.copy{font:400 13px ui-sans-serif,system-ui;fill:#52525b}.label{font:650 10px ui-monospace,monospace;letter-spacing:.08em}.edge{fill:none;stroke:#71717a;stroke-width:1.5;vector-effect:non-scaling-stroke}.diagram-reveal{transform-box:fill-box;transform-origin:center}</style>
  <g class="diagram-reveal" style="--reveal-start:0%;--reveal-end:14%" data-review-id="diagram.static-path.source"><rect class="stage" x="120" y="30" width="380" height="120" rx="16" fill="#fafafa" stroke="#d4d4d8"/><text class="label" x="150" y="60" fill="#71717a">SOURCE AUTHORITY</text><text class="title" x="150" y="94">Approved PRD or design content</text><text class="copy" x="150" y="122">Claims · decisions · evidence · stable review IDs</text></g>
  <g class="diagram-reveal" style="--reveal-start:12%;--reveal-end:28%"><path class="edge" d="M310 150V260" marker-end="url(#arrow)"/></g>
  <g class="diagram-reveal" style="--reveal-start:24%;--reveal-end:42%" data-review-id="diagram.static-path.shell"><rect class="stage" x="120" y="260" width="380" height="130" rx="16" fill="#ecfdf5" stroke="#10b981"/><text class="label" x="150" y="290" fill="#047857">STATIC SHELL BUILD</text><text class="title" x="150" y="325">Protocol presentation</text><text class="copy" x="150" y="353">Inline CSS · generated section rail · semantic motion</text><text class="copy" x="150" y="375">No content transformation or server contract</text></g>
  <g class="diagram-reveal" style="--reveal-start:38%;--reveal-end:54%"><path class="edge" d="M310 390V500" marker-end="url(#arrow)"/></g>
  <g class="diagram-reveal" style="--reveal-start:50%;--reveal-end:68%" data-review-id="diagram.static-path.artifact"><rect class="stage" x="120" y="500" width="380" height="130" rx="16" fill="#fff" stroke="#10b981"/><text class="label" x="150" y="530" fill="#047857">PORTABLE ARTIFACT</text><text class="title" x="150" y="565">One self-contained HTML file</text><text class="copy" x="150" y="593">Open directly · review offline · share by path</text><text class="copy" x="150" y="615">Complete article and diagram remain in source order</text></g>
  <g class="diagram-reveal" style="--reveal-start:58%;--reveal-end:74%" data-review-id="diagram.static-path.fallback"><path class="edge" d="M500 565H585V650" marker-end="url(#arrow)"/><rect class="stage" x="500" y="650" width="190" height="120" rx="14" fill="#fffbeb" stroke="#f59e0b"/><text class="label" x="522" y="680" fill="#b45309">FALLBACKS</text><text class="copy" x="522" y="712">Reduced motion</text><text class="copy" x="522" y="736">Scripts removed · print</text></g>
  <g class="diagram-reveal" style="--reveal-start:70%;--reveal-end:84%"><path class="edge" d="M310 630V770" marker-end="url(#arrow)"/></g>
  <g class="diagram-reveal" style="--reveal-start:80%;--reveal-end:96%" data-review-id="diagram.static-path.reader"><rect class="stage" x="120" y="770" width="380" height="120" rx="16" fill="#fafafa" stroke="#d4d4d8"/><text class="label" x="150" y="800" fill="#71717a">READER</text><text class="title" x="150" y="835">Navigable product evidence</text><text class="copy" x="150" y="863">Intent → architecture → diagram → provenance</text></g>
</svg>